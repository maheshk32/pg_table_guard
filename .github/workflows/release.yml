name: Build and Release RPM

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0, v1.1, v2.0, etc.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build RPM (PG ${{ matrix.pg_version }})
    runs-on: ubuntu-latest
    container:
      image: almalinux:8

    strategy:
      matrix:
        pg_version: [13, 14, 15, 16, 17, 18]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install PGDG repo
        run: |
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-8-x86_64/pgdg-redhat-repo-latest.noarch.rpm
          dnf module disable postgresql -y

      - name: Install build dependencies
        run: |
          dnf install -y epel-release
          /usr/bin/crb enable
          dnf install -y \
            gcc make redhat-rpm-config \
            rpm-build rpmdevtools \
            perl-IPC-Run \
            postgresql${{ matrix.pg_version }}-devel

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create source tarball
        run: |
          SNAME=pg_table_guard
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p $HOME/rpmbuild/SOURCES/${SNAME}-${VERSION}
          mkdir -p $HOME/rpmbuild/SPECS
          cp table_guard.c table_guard.control "table_guard--1.0.sql" Makefile \
            $HOME/rpmbuild/SOURCES/${SNAME}-${VERSION}/
          tar -czf $HOME/rpmbuild/SOURCES/${SNAME}-${VERSION}.tar.gz \
            -C $HOME/rpmbuild/SOURCES ${SNAME}-${VERSION}

      - name: Prepare spec file
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p $HOME/rpmbuild/SPECS
          sed \
            -e "s/^%global pgmajorversion.*/%global pgmajorversion ${{ matrix.pg_version }}/" \
            -e "s/^Version:.*/Version:        ${VERSION}/" \
            pg_table_guard.spec > $HOME/rpmbuild/SPECS/pg_table_guard_${{ matrix.pg_version }}.spec
          echo "--- Spec file written ---"
          cat $HOME/rpmbuild/SPECS/pg_table_guard_${{ matrix.pg_version }}.spec

      - name: Build RPM
        run: |
          rpmbuild -ba $HOME/rpmbuild/SPECS/pg_table_guard_${{ matrix.pg_version }}.spec

      - name: Copy RPM to workspace
        run: |
          mkdir -p dist
          cp $HOME/rpmbuild/RPMS/x86_64/pg_table_guard_${{ matrix.pg_version }}-*.x86_64.rpm dist/
          echo "RPM files in dist/:"
          ls -lh dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-pg${{ matrix.pg_version }}
          path: dist/*.rpm

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms/
          merge-multiple: true

      - name: Delete existing release if present
        run: gh release delete ${{ github.ref_name }} --yes --repo ${{ github.repository }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release and upload RPMs
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          cat > /tmp/release_notes.md << EOF
          ## pg_table_guard ${{ github.ref_name }}

          PostgreSQL extension that prevents DROP TABLE, TRUNCATE, and DELETE without WHERE.

          ### Installation

          Pick the command for your PostgreSQL version:

          **PostgreSQL 13:**
          \`\`\`bash
          sudo dnf install ${BASE_URL}/pg_table_guard_13-${VERSION}-1.el8.x86_64.rpm
          \`\`\`

          **PostgreSQL 14:**
          \`\`\`bash
          sudo dnf install ${BASE_URL}/pg_table_guard_14-${VERSION}-1.el8.x86_64.rpm
          \`\`\`

          **PostgreSQL 15:**
          \`\`\`bash
          sudo dnf install ${BASE_URL}/pg_table_guard_15-${VERSION}-1.el8.x86_64.rpm
          \`\`\`

          **PostgreSQL 16:**
          \`\`\`bash
          sudo dnf install ${BASE_URL}/pg_table_guard_16-${VERSION}-1.el8.x86_64.rpm
          \`\`\`

          **PostgreSQL 17:**
          \`\`\`bash
          sudo dnf install ${BASE_URL}/pg_table_guard_17-${VERSION}-1.el8.x86_64.rpm
          \`\`\`

          **PostgreSQL 18:**
          \`\`\`bash
          sudo dnf install ${BASE_URL}/pg_table_guard_18-${VERSION}-1.el8.x86_64.rpm
          \`\`\`

          Then add to \`postgresql.conf\`:
          \`\`\`ini
          shared_preload_libraries = 'table_guard'
          \`\`\`
          Restart PostgreSQL and optionally run \`CREATE EXTENSION table_guard;\` in each database.

          ### Scope configuration
          \`\`\`sql
          -- Protect only databases where extension is installed:
          ALTER DATABASE mydb SET table_guard.scope = 'database';

          -- Protect specific tables only:
          ALTER DATABASE mydb SET table_guard.scope = 'table';
          ALTER DATABASE mydb SET table_guard.protected_tables = 'mydb.public.orders, mydb.audit.*';

          SELECT pg_reload_conf();
          \`\`\`
          EOF

          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md \
            rpms/*.rpm
        env:
          GH_TOKEN: ${{ github.token }}
